  <style>:root {
  color-scheme: light;
  --canvas: #fdfdfd;
  --ink: #172330;
  --muted: #4f5c6c;
  --line: #b9c3ce;
  --well: #e9eef2;
  --well-line: #d1dae2;
  --orange: #a43e0a;
  --focus: #a43e0a;
  --action-ink: #f7fafc;
  --ready: #326045;
  --icon-edge: #293f53;
  --mono: ui-monospace, 'SFMono-Regular', Consolas, monospace;
  font: 100%/1.45 system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--canvas);
  color: var(--ink);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme]) {
    color-scheme: dark;
    --canvas: #0b141d;
    --ink: #eef3f7;
    --muted: #b6c4d3;
    --line: #67798a;
    --well: #192a3a;
    --well-line: #41576c;
    --orange: #ffac61;
    --focus: #ffac61;
    --action-ink: #101b26;
    --ready: #a8dcb6;
    --icon-edge: #43586d;
  }
}
:root[data-theme='dark'] {
  color-scheme: dark;
  --canvas: #0b141d;
  --ink: #eef3f7;
  --muted: #b6c4d3;
  --line: #67798a;
  --well: #192a3a;
  --well-line: #41576c;
  --orange: #ffac61;
  --focus: #ffac61;
  --action-ink: #101b26;
  --ready: #a8dcb6;
  --icon-edge: #43586d;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; }
main { max-width: 47rem; margin: 0 auto; padding: 1.7rem clamp(1rem, 7vw, 2rem) 2rem; }
p, h1, h2, h3, figure { margin: 0; }
h1, h2, h3 { overflow-wrap: anywhere; }
h1 { max-width: 12em; margin: .5rem 0 1.15rem; font-size: clamp(1.9rem, 8.6vw, 3.1rem); line-height: 1.02; letter-spacing: -.055em; font-weight: 790; }
h2 { font-size: clamp(1.12rem, 5vw, 1.45rem); line-height: 1.17; letter-spacing: -.034em; }
h3 { font-size: 1rem; }
button, input, select { font: inherit; color: inherit; }
button, select { min-height: 44px; cursor: pointer; }
button { padding: 0; border: 0; background: transparent; }
button[aria-disabled='true'] { opacity: .66; cursor: default; }
button:focus-visible, select:focus-visible, input:focus-visible, summary:focus-visible, [tabindex='-1']:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 4px;
  border-radius: 4px;
}
svg { display: block; width: 1.25em; height: 1.25em; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.eyebrow { color: var(--orange); font: 600 .77rem/1.5 var(--mono); letter-spacing: .15em; text-transform: uppercase; }
.accent { color: var(--orange); }
.muted { color: var(--muted); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0, 0, 0, 0); clip-path: inset(50%); white-space: nowrap; }
.back { display: flex; align-items: center; gap: .38em; color: var(--muted); margin: -.9rem 0 .7rem -.4rem; padding: 0 .4rem; }
.back svg { width: 1.15em; }
.browse-controls { position: sticky; inset-block-start: 0; z-index: 1; padding-top: .35rem; background: var(--canvas); }
.browse-filters { display: flex; align-items: flex-end; gap: .35rem; margin-top: .45rem; border-bottom: 1px solid var(--line); }
.search { display: flex; align-items: center; min-height: 50px; background: var(--well); border: 1px solid var(--well-line); border-radius: .65rem; color: var(--muted); }
.search > span { margin-inline: .8rem .65rem; font-size: 1.16rem; }
.search input { width: 100%; min-width: 0; min-height: 46px; padding: .4rem .6rem .4rem 0; color: var(--ink); background: transparent; border: 0; border-radius: .4rem; }
.search input::placeholder { color: var(--muted); opacity: 1; }
.search input::-webkit-search-cancel-button { -webkit-appearance: none; }
.clear { flex: 0 0 44px; min-width: 44px; display: grid; place-items: center; }
.categories { flex: 1; display: flex; align-items: stretch; flex-wrap: wrap; gap: 0 clamp(.35rem, 2vw, 1.3rem); }
.category { color: var(--muted); min-width: 44px; padding: .45rem .25rem; border-bottom: 3px solid transparent; font-weight: 520; }
.category[aria-pressed='true'] { border-bottom-color: var(--orange); color: var(--ink); font-weight: 720; }
.feed-heading-row { margin: .9rem 0 .6rem; }
.feed :is(button, [tabindex]) { scroll-margin-block-start: 7rem; }
.scope { color: var(--muted); font-size: .875rem; margin-top: .2rem; }
#listing:not(.search-mode) h1 { max-width: 13ch; }
.search-mode h1, #detail h1 { font-size: clamp(1.8rem, 7.5vw, 2.55rem); }
.filter { position: relative; flex: 0 0 44px; display: grid; color: var(--muted); }
.filter select { width: 44px; appearance: none; border: 1px solid transparent; background: var(--canvas); border-radius: .45rem; color: transparent; }
.filter select option { color: var(--ink); }
.filter select[data-active='available'] { background: var(--well); border-color: var(--well-line); }
.filter select[data-active='available'] + span { color: var(--orange); }
#filter-icon { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; }
.notice, .empty { padding: .9rem; border-radius: .6rem; background: var(--well); border: 1px solid var(--well-line); color: var(--muted); font-size: .9rem; margin: .55rem 0; }
.empty .secondary { margin-top: .7rem; }
.results, .capabilities { margin: 0; padding: 0; list-style: none; }
.row { padding: .45rem 0; border-bottom: 1px solid var(--line); }
.row-cell { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: .2rem .65rem; }
.row-info { flex: 1 1 10rem; min-width: 0; display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: .7rem; text-align: start; border-radius: .35rem; padding: .12rem 0; }
.row-info:hover .row-title { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: .18em; }
.row-summary, .row-title, .row-description { display: block; min-width: 0; }
.row-title { font-size: 1.08rem; line-height: 1.2; letter-spacing: -.025em; overflow-wrap: anywhere; }
.row-description { font-size: .88rem; color: var(--muted); margin-top: .15rem; overflow: hidden; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow-wrap: anywhere; }
.app-icon { display: grid; place-items: center; width: 3rem; height: 3rem; background: #172635; border: 1px solid var(--icon-edge); border-radius: .72rem; overflow: hidden; }
.app-icon img { width: 100%; height: 100%; object-fit: cover; }
.app-icon-large { width: 4.55rem; height: 4.55rem; border-radius: .95rem; }
.tile-pattern { display: grid; grid-template-columns: repeat(3, .27rem); gap: .11rem; rotate: -12deg; }
.tile-pattern i { background: #788999; border-radius: .045rem; aspect-ratio: 1; }
.tile-pattern .lit { background: #ffb368; }
.app-icon-large .tile-pattern { grid-template-columns: repeat(3, .39rem); gap: .16rem; }
.row-art { margin: 0; }
.row-art:not(:empty) { margin-bottom: .6rem; }
.preview img { display: block; width: 100%; height: auto; aspect-ratio: 3 / 1; object-fit: cover; background: var(--well); border-radius: .7rem; }
.primary, .secondary { padding: .45rem .85rem; border-radius: .65rem; font-weight: 700; }
.primary { color: var(--action-ink); background: var(--ink); }
.row-open { flex: 0 0 auto; min-width: 4.25rem; font-size: .91rem; }
.open-action { display: inline-flex; align-items: center; justify-content: center; gap: .5em; }
.open-action[data-opening] { opacity: 1; }
.open-spinner { display: none; }
.open-action[data-opening] .open-spinner {
  display: block;
  flex: 0 0 auto;
  width: 1em;
  height: 1em;
  border: .13em solid currentColor;
  border-inline-end-color: transparent;
  border-radius: 50%;
  animation: open-spin .8s linear infinite;
}
@keyframes open-spin { to { transform: rotate(1turn); } }
@media (prefers-reduced-motion: reduce) {
  .open-action[data-opening] .open-spinner { animation: none; }
}
.secondary { border: 1px solid var(--well-line); background: var(--well); }
.quiet { padding: .45rem .7rem; color: var(--muted); font-weight: 560; }
.quiet:hover { text-decoration: underline; }
.feed-actions { display: flex; flex-wrap: wrap; gap: .25rem; justify-content: center; margin-top: .8rem; }
.coverage { padding-top: .7rem; text-align: center; color: var(--muted); font: .74rem/1.5 var(--mono); }
.identity { display: flex; align-items: center; gap: .85rem; margin-bottom: 1rem; }
.identity > div { min-width: 0; }
.identity .app-icon { flex: 0 0 auto; }
.app-name { font-size: clamp(1.3rem, 6vw, 1.75rem); }
.identity .muted { margin-top: .2rem; }
.detail-actions { margin-bottom: .9rem; text-align: center; }
.detail-open { width: 100%; min-height: 48px; }
.compat-state { margin: .45rem 0 .12rem; font-size: .87rem; font-weight: 690; }
.compat-state.ready { color: var(--ready); }
.compat-state.warn, .cap-state { color: var(--orange); }
.compat-detail, .settings-instructions, .feedback { color: var(--muted); font-size: .88rem; }
.feedback, .settings-instructions { margin-top: .6rem; background: var(--well); padding: .65rem; border-radius: .5rem; }
.feedback .quiet { display: block; color: var(--ink); margin: 0 auto; }
.detail-art:not(:empty) { margin-bottom: .8rem; }
.detail-art .preview img { aspect-ratio: auto; max-height: 22rem; object-fit: contain; }
.preview figcaption { margin-top: .25rem; text-align: center; color: var(--muted); font-size: .8rem; }
.detail-section { padding: .68rem .05rem .75rem; border-top: 1px solid var(--line); }
.detail-section h2 { margin-bottom: .28rem; font-size: 1.14rem; }
.detail-section p { font-size: .93rem; }
.description { white-space: pre-wrap; overflow-wrap: anywhere; }
summary { display: flex; align-items: center; gap: .55rem; min-height: 44px; cursor: pointer; list-style: none; }
summary::-webkit-details-marker { display: none; }
summary svg:last-child { margin-left: auto; flex: 0 0 auto; }
details[open] summary svg:last-child { rotate: 90deg; }
.publisher summary { color: var(--ink); overflow-wrap: anywhere; }
.publisher summary svg:first-child { width: 1.65em; height: 1.65em; flex: 0 0 auto; color: var(--muted); }
.publication { padding: .25rem .05rem; border-block: 1px solid var(--line); }
.publication summary { color: var(--orange); justify-content: center; font-weight: 650; }
.publication summary svg:last-child { margin-left: 0; }
.publication[open] summary svg:last-child { rotate: 180deg; }
.reference { padding: .45rem 0; font-size: .82rem; }
.reference code { display: block; overflow-wrap: anywhere; font-family: var(--mono); font-size: .88em; user-select: text; -webkit-user-select: text; direction: ltr; }
.cap-group { margin-top: .55rem; color: var(--muted); font-size: .83rem; font-weight: 660; }
.cap-row { display: grid; align-items: start; grid-template-columns: auto minmax(0, 1fr); gap: .65rem; margin-top: .4rem; overflow-wrap: anywhere; }
.cap-icon { display: grid; place-items: center; width: 2.5rem; height: 2.5rem; color: var(--muted); background: var(--well); border-radius: .55rem; }
.cap-row .cap-state { font-size: .81rem; }

@media (min-width: 35rem) {
  main { padding-top: 2.25rem; }
  .row { padding: .65rem 0; }
  .row-info { gap: .9rem; }
  .app-icon { width: 3.35rem; height: 3.35rem; }
  .app-icon-large { width: 4.75rem; height: 4.75rem; }
}
</style>
