plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}
group = 'org.nostrocket.hypergolic.signercore'
version = '0.0.0'
expoModule { canBePublished false }
android {
  namespace 'org.nostrocket.hypergolic.signercore'
  defaultConfig {
    versionCode 1; versionName '0.0.0'
    externalNativeBuild { cmake { arguments '-DANDROID_STL=c++_static' } }
  }
  externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
}
dependencies {
  implementation project(':hypergolic-identity-owner')
  implementation project(':hypergolic-napplet-host')
  implementation 'com.facebook.react:react-android'
}
